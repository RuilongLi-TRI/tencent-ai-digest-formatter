t){'use strict';
const VERSION=3;
const LEGACY_VERSION=2;
const REASONS=['未标注','知识缺口','读题','计算','时间','未知','未归因','概念','策略'];
const EVENT_TYPES=['answer','clear','flag','unflag','skip','jump','revisit','submit','timeout','summary'];
const ROLES=['planned','planned-review','mistake-merged','mistake-replace'];
const MAX_EVENTS=60;
const KEEP_EVENTS=30;
const MAX_IMPORT_EVENTS=200;
const MAX_ACTIVE_MS=1200000;
const SOFT_CHARS=380000;

function defaults(){return {schema:VERSION,settings:{week:1,startDate:'2026-11-07',pins:[]},history:[],active:null,notes:{},snapshots:{}}}
function dayKey(t){return new Date(t+8*3600000).toISOString().slice(0,10)}
function remaining(deadline,now){return Math.max(0,Math.ceil((deadline-now)/1000))}
function phase(a,now){if(a.phase==='review')return 'review';if(now>=a.solveDeadline)return 'submit';if(now>=a.learnEnd)return 'solve';return 'learn'}
function htmlEscape(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function zeros(){return [0,0,0,0,0]}
function clone(x){return JSON.parse(JSON.stringify(x))}

function score(ids,answers,bank){let correct=0,blank=0;const topics={};ids.forEach((id,i)=>{const q=bank[id];if(!q)throw Error('未知题号');const yes=answers[i]===q.correct;correct+=Number(yes);blank+=Number(answers[i]===null||answers[i]===undefined);const o=topics[q.topic]||(topics[q.topic]={correct:0,total:0,blank:0});o.total++;o.correct+=Number(yes);o.blank+=Number(answers[i]===null||answers[i]===undefined)});return {correct,total:ids.length,blank,wrong:ids.length-correct-blank,topics}}

function outcome(answer,correct){if(answer===null||answer===undefined)return 'blank';return answer===correct?'correct':'wrong'}

function mistakes(history,bank,now=Date.now()){
 const out={};
 for(const h of history)h.ids.forEach((id,i)=>{
  const q=bank[id];if(!q)return;
  const kind=outcome(h.answers[i],q.correct);
  if(!out[id])out[id]={id,first:null,last:h.finished,lastWeek:h.week,streak:0,lastCorrect:null,wrong:0,blank:0,correct:0,attempts:0,attemptIds:[],missKind:null};
  const m=out[id];
  m.attempts++;
  if(m.attemptIds.length<12)m.attemptIds.push(h.id);
  if(kind==='correct'){
   m.correct++;
   const date=dayKey(h.finished),prev=dayKey(m.last);
   if(m.wrong+m.blank>0&&date>prev&&date!==m.lastCorrect){m.streak++;m.lastCorrect=date}
   m.last=h.finished;m.lastWeek=h.week;
  }else{
   if(kind==='blank')m.blank++;else m.wrong++;
   if(m.first==null)m.first=h.finished;
   m.streak=0;m.lastCorrect=null;m.missKind=kind;m.last=h.finished;m.lastWeek=h.week;
  }
 });
 return Object.values(out).filter(m=>m.wrong+m.blank>0).map(m=>({...m,mastered:m.streak>=2,eligible:m.streak<2&&dayKey(now)>dayKey(m.last),memory:true,variant:false})).sort((a,b)=>a.last-b.last)
}

function sessionQuestions(week,history,bank,now,pins){
 pins=Array.isArray(pins)?pins:[];
 const ids=week.ids.slice(),planned=week.ids.slice();
 const maxExtra=week.checkpoint?1:2;
 const pending=mistakes(history,bank,now).filter(m=>{
  if(dayKey(now)<=dayKey(m.last)||m.lastWeek>=week.week)return false;
  if(pins.includes(m.id))return true;
  return m.eligible;
 }).sort((a,b)=>(pins.includes(b.id)-pins.includes(a.id))||(a.last-b.last));
 const replacements=[];
 const merged=[];
 for(const m of pending){
  if(merged.length+replacements.length>=maxExtra)break;
  if(ids.includes(m.id))merged.push(m);
 }
 const slots=[];
 if(week.reviewId){const ri=planned.indexOf(week.reviewId);if(ri>=0)slots.push(ri)}
 if(!week.checkpoint){for(let i=4;i>=3;i--)if(!slots.includes(i))slots.push(i)}
 for(const m of pending){
  if(merged.length+replacements.length>=maxExtra)break;
  if(ids.includes(m.id))continue;
  for(const idx of slots){
   if(replacements.some(r=>r.index===idx))continue;
   const removed=ids[idx];
   const types=ids.map((id,i)=>i===idx?bank[m.id].type:bank[id].type);
   if(new Set(types).size!==5)continue;
   ids[idx]=m.id;
   replacements.push({index:idx,plannedId:removed,usedId:m.id,postponedMethod:bank[removed].methodName,postponedTopic:bank[removed].topic,fromWeek:m.lastWeek,kind:m.missKind,pinned:pins.includes(m.id),memory:true,variant:false});
   break;
  }
 }
 const roles=ids.map((id,i)=>{
  if(replacements.some(r=>r.index===i))return 'mistake-replace';
  if(merged.some(m=>m.id===id))return 'mistake-merged';
  if(id===week.reviewId)return 'planned-review';
  return 'planned';
 });
 const reviewIds=[];
 ids.forEach((id,i)=>{if(roles[i]!=='planned')reviewIds.push(id)});
 const origins=ids.map((id,i)=>{
  const rep=replacements.find(r=>r.index===i);
  if(rep)return {week:rep.fromWeek,kind:rep.kind,variant:false,pinned:rep.pinned};
  if(roles[i]==='mistake-merged'){const m=merged.find(x=>x.id===id);return {week:m.lastWeek,kind:m.missKind,variant:false,pinned:pins.includes(id)}}
  if(roles[i]==='planned-review')return {week:week.reviewFrom||null,kind:'planned',variant:false,pinned:false};
  return null;
 });
 return {ids,planned,reviewIds,replaced:replacements.length>0,replacements,roles,origins,kept:planned.filter(id=>ids.includes(id))};
}

function suggestion(h,bank){if(!h)return '先从第1周的5题观察起，不另外做诊断。';const sc=score(h.ids,h.answers,bank);if(sc.correct<=2)return '先不赶进度。下次周六可以重练同一周，或在这30分钟里多画图、少追题数。';if(sc.correct<=4)return '下次周六最多把1–2道到期错题换进原来的5题，不另加时间。其它工作日不用补练。';return '可以手动进入下一周。能说清关键方法，比记住五个答案更重要。'}

function countEvents(list,into){
 for(const e of list){
  if(e.type==='summary'&&e.counts){for(const k of Object.keys(into))into[k]+=e.counts[k]||0}
  else if(into[e.type]!=null)into[e.type]++;
 }
}
function emptyCounts(){return {answer:0,clear:0,flag:0,unflag:0,skip:0,jump:0,revisit:0,submit:0,timeout:0}}
function logEvent(events,ev){
 const list=Array.isArray(events)?events.slice():[];
 const seq=list.reduce((m,e)=>Math.max(m,e.seq||0),0)+1;
 list.push({seq,t:ev.t,type:ev.type,i:ev.i==null?null:ev.i,id:ev.id||null,a:ev.a==null?null:ev.a,b:ev.b==null?null:ev.b});
 if(list.length<=MAX_EVENTS)return list;
 const head=list.slice(0,list.length-KEEP_EVENTS),tail=list.slice(list.length-KEEP_EVENTS);
 const counts=emptyCounts();
 countEvents(head,counts);
 return [{seq:head[0].seq,t:head[0].t,type:'summary',i:null,id:null,a:null,b:null,counts,folded:head.length}].concat(tail);
}

function timeView(ms,open,index,now,active){
 const out=(ms||zeros()).slice();
 let slot=open;
 if(slot&&(!active||slot.i!==index)){
  const add=Math.max(0,Math.min(MAX_ACTIVE_MS,now-slot.t));
  out[slot.i]=Math.max(0,Math.min(MAX_ACTIVE_MS,(out[slot.i]||0)+add));
  slot=null;
 }
 if(active&&!slot)slot={i:index,t:now};
 return {ms:out,open:slot};
}

function snapshotOf(q,source){return {id:q.id,topic:q.topic,methodName:q.methodName,method:q.method,prompt:q.prompt,options:q.options.slice(),correct:q.correct,answer:q.answer,explanation:q.explanation,source:source||'presented'}}

function bucket(){return {correct:0,total:0,blank:0,wrong:0}}
function addBucket(b,answer,correct){b.total++;if(answer===correct)b.correct++;else if(answer==null)b.blank++;else b.wrong++}

function analyze(state,data,now){
 now=now||Date.now();
 const history=state.history||[];
 const bank=data.bank;
 const acc=bucket();
 const topics={};
 const fresh=bucket(),review=bucket();
 let unrecordedSplit=false;
 const byWeek={};
 history.forEach(h=>{
  h.ids.forEach((id,i)=>{
   const q=bank[id];if(!q)return;
   const answer=h.answers[i];
   addBucket(acc,answer,q.correct);
   const topic=topics[q.topic]||(topics[q.topic]=Object.assign(bucket(),{topic:q.topic,ids:[]}));
   addBucket(topic,answer,q.correct);
   if(!topic.ids.includes(id))topic.ids.push(id);
   const role=h.roles?h.roles[i]:null;
   if(!role)unrecordedSplit=true;
   else if(role==='planned')addBucket(fresh,answer,q.correct);
   else addBucket(review,answer,q.correct);
  });
  const w=byWeek[h.week]||(byWeek[h.week]={week:h.week,attempts:0,latest:null});
  w.attempts++;
  if(!w.latest||h.finished>=w.latest.finished)w.latest=h;
 });
 const weeks=Object.values(byWeek).sort((a,b)=>a.week-b.week);
 let trend;
 if(!history.length)trend='还没有交卷记录，看不出各周变化。';
 else if(weeks.length<2)trend='目前只有第'+weeks[0].week+'周的记录，看不出各周变化。';
 else trend='各周最近一次的答对题数可以并排列出。次数少，不能当成稳定变化，也不是正式考试的结论。';
 const weekRows=weeks.map(w=>{
  const sc=score(w.latest.ids,w.latest.answers,bank);
  return {week:w.week,attempts:w.attempts,latestId:w.latest.id,correct:sc.correct,total:sc.total,blank:sc.blank,wrong:sc.wrong};
 });
 const due=mistakes(history,bank,now).filter(m=>m.eligible);
 const repeated=mistakes(history,bank,now).filter(m=>m.wrong+m.blank>=2);
 const priorities=[];
 const pool=(repeated.length?repeated:due).slice().sort((a,b)=>(b.wrong+b.blank)-(a.wrong+a.blank)||a.last-b.last);
 for(const m of pool){
  if(priorities.length>=2)break;
  const q=bank[m.id];
  priorities.push({id:m.id,methodName:q.methodName,topic:q.topic,wrong:m.wrong,blank:m.blank,attempts:m.attempts,attemptIds:m.attemptIds.slice(),mastered:m.mastered,kind:m.missKind,reason:repeated.length?'这道题有多次答错或未作答':'这道题到了另一个日期，可以在下次周六的5题里替换进去'});

function modal(title,body,yes,label='确认',danger=false){const host=$('#modalHost'),previous=document.activeElement;host.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${esc(title)}</h2>${body}<div class="row"><button id="cancel">取消</button><button id="confirm" class="${danger?'danger':'primary'}">${esc(label)}</button></div></section></div>`;const close=()=>{host.innerHTML='';previous?.focus()};$('#cancel').onclick=close;$('#confirm').onclick=()=>{close();yes()};$('#confirm').focus();host.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const list=[...host.querySelectorAll('button,a,input,select')];if(!list.length)return;if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}}}
function dateFor(week){const d=new Date(state.settings.startDate+'T12:00:00+08:00');d.setUTCDate(d.getUTCDate()+7*(week-1));return d.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric'})+' 周六'}
function done(w){return state.history.some(h=>h.week===w&&h.reviewDone)}
function go(v){view=v;resultId=null;render();window.scrollTo(0,0)}
function activeCard(){if(!state.active)return '';const a=state.active;return `<div class="card warm"><div class="row" style="justify-content:space-between"><div><strong>第${a.week}周${a.phase==='review'?'待复盘':'正在计时'}</strong><div class="small muted">关闭网页不暂停计时，不会另开一份。</div></div>${btn(a.phase==='review'?'继续复盘':'恢复本次训练','resume','primary')}</div></div>`}
function planNote(picked,week){if(!picked||!picked.replacements||!picked.replacements.length)return '';const keptIds=picked.kept&&picked.kept.length?picked.kept:(picked.ids||[]).filter((id,i)=>!picked.replacements.some(r=>r.index===i));const lines=picked.replacements.map(r=>`第${r.index+1}题换成第${r.fromWeek||'?'}周的${r.kind==='blank'?'未作答':'答错'}原题。原定「${esc(r.postponedMethod)}」顺延，不另加题、不加时间。题库没有新编变式，所以仍是同一道原题。`);const kept=keptIds.map(id=>esc(DATA.bank[id].methodName)).join('、');const cap=week&&week.checkpoint?'阶段回看最多替换 1 题，其余代表题仍在这 5 题里。':'最多替换 2 题，其余原定重点仍在这 5 题里。';return `<div class="note">${lines.join('<br>')}<br>这次仍保留：${kept}。<br>${cap}</div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('on',n.dataset.nav===view));if(view==='session')return sessionHTML();if(view==='result')return resultHTML();app.innerHTML=({home:homeHTML,map:mapHTML,mistakes:mistakesHTML,parent:parentHTML}[view]||homeHTML)()}
function homeHTML(){const w=DATA.weeks[state.settings.week-1],finished=DATA.weeks.filter(x=>done(x.week)).length;return `${activeCard()}<section class="hero"><div><div class="eyebrow">ONE SATURDAY. ONE SMALL DISCOVERY.</div><div class="row" style="margin-bottom:15px"><span class="tag">第 ${w.week} / 12 周</span><span class="tag warm">${w.checkpoint?'本周混合回看':'本周5道代表题'}</span></div><h1>每周六，<br>留30分钟想一想。</h1><p class="muted">${esc(w.title)} · ${esc(w.subtitle)}。不是每天练，也没有额外诊断、加测或书架作业。</p>${btn(state.active?'继续本周的30分钟':'开始本周的30分钟','start','primary',`data-week="${w.week}"`)}<div class="mini-caption muted">参考安排：${dateFor(w.week)}（上海日历） · 缺席就顺延，不用补课。</div></div><div class="hero-art" aria-hidden="true"><div class="orbit"><strong>30<span style="position:static;font-size:15px;box-shadow:none;background:none;padding:0 2px">min</span></strong><span class="a">只在周六 · 轻轻开始</span><span class="b">少做一点，想透一点</span></div></div></section><div class="stats"><div class="stat"><strong>1 次<span> / 周</span></strong><span>周一至周五、周日无任务</span></div><div class="stat"><strong>5 题<span> / 次</span></strong><span>不同关键方法，不靠堆题</span></div><div class="stat"><strong>${finished}<span> / 12 周</span></strong><span>完成复盘才记录 · 可重练</span></div></div><div class="grid2"><section class="card"><h2>30分钟，一份就够</h2>${budget()}<ul class="step-list"><li><div class="step-no">3′</div><div><strong>看一个概念和小例子</strong><span>第1周的起点观察直接融入5题，不另开诊断。</span></div></li><li><div class="step-no">20′</div><div><strong>自己尝试5道代表题</strong><span>到期错题最多换入2题，总数仍是5题。</span></div></li><li><div class="step-no">7′</div><div><strong>只讲透1–2道精选错题</strong><span>其余留在记录里，不要求周中补做。</span></div></li></ul></section><section class="card tint"><h2>这周抓住什么？</h2><p>${esc(w.intro)}</p><div class="row">${[...new Set(w.ids.map(id=>DATA.bank[id].topic))].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="small muted" style="margin-top:16px">${w.reviewId?`末尾可以回看更早的重点。到期错题会替换或合并进这5题，阶段回看最多换1题，绝不追加。`:'这5题就是起点观察，不据此分档定级，不增加题量。'}</p>${btn('看看12周怎么轮转','navMap')}</section></div><div class="note"><strong>这是低负担重点训练与兴趣/基础维护。</strong>12周合计仅6小时，不代表所有AMC8考法已掌握，也不承诺高分。基础薄弱可下次周六重练本周，缺席后顺延；不产生补课债务。</div>`}
function mapHTML(){const z=DATA.weeks[mapWeek-1];return `<div class="section-head"><div><div class="eyebrow">IMPORTANT IDEAS, SPACED OUT</div><h1>12周重点地图</h1></div><span class="tag">每周六一次 · 不加测</span></div><p class="muted">运算、数论、建模、几何、计数概率、规律逻辑和数据轮换出现。只抓关键代表方法，不声称穷尽全部考法。</p><div class="note">第4、8、12周用混合回看替换本周主题题组，仍然3′+20′+7′=30分钟。到期错题在普通周最多换入2题，阶段回看最多换1题，被换下的重点会写明并顺延。</div><div class="week-grid">${DATA.weeks.map(w=>`<article class="week-card ${mapWeek===w.week?'active':''} ${w.checkpoint?'checkpoint':''}"><div class="row" style="justify-content:space-between"><span class="tag">W${String(w.week).padStart(2,'0')}</span><span class="small muted">${done(w.week)?'✓ 已复盘':w.checkpoint?'混合回看':'重点轮转'}</span></div><h3>${esc(w.title)}</h3><p>${esc(w.subtitle)}<br>5题 · 总30分钟<br><span class="small">参考${dateFor(w.week)}</span></p>${btn('查看本周重点','weekDetail','',`data-week="${w.week}"`)}</article>`).join('')}</div><section class="card" id="weekDetails" style="margin-top:24px"><div class="section-head"><h2>第${z.week}周 · ${esc(z.title)}</h2>${btn('设为当前周','chooseWeek','primary',`data-week="${z.week}"`)}</div><p>${esc(z.intro)}</p>${budget()}<div class="table-wrap"><table><thead><tr><th>题位</th><th>本题关键方法</th><th>主题</th><th>安排</th></tr></thead><tbody>${z.ids.map((id,i)=>{const q=DATA.bank[id];return `<tr><td>${i+1}</td><td>${esc(q.methodName)}</td><td>${esc(q.topic)}</td><td>${id===z.reviewId?`回看第${z.reviewFrom}周，可被适合的过往错题替换`:'代表题，先独立想'}</td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:13px">这不是额外作业清单。每周只有这一份5题，复盘只讲1–2题，不另设工作日练习。</p>${btn(`开始第${z.week}周的30分钟`,'start','',`data-week="${z.week}"`)}</section>`}
function kindLabel(kind){return kind==='blank'?'未作答':kind==='wrong'?'答错':'未记录'}
function mistakesHTML(){const ms=C.mistakes(state.history,DATA.bank);const blanks=ms.filter(m=>m.missKind==='blank'&&!m.mastered),wrongs=ms.filter(m=>m.missKind!=='blank'&&!m.mastered),doneMs=ms.filter(m=>m.mastered);const card=m=>{const q=DATA.bank[m.id];return `<article class="review-item ${m.mastered?'good':'bad'}"><div class="row"><span class="tag ${m.mastered?'':'warm'}">${m.mastered?'两个更晚的日期答对过':'留待另一个日期'}</span><span class="small muted">${kindLabel(m.missKind)} · 答错${m.wrong}次 · 未作答${m.blank}次 · 共${m.attempts}次</span></div><h3 style="margin-top:12px">${math(q.prompt)}</h3>${diagram(q)}<p class="small">关键方法：${esc(q.methodName)}。同一道原题再做，只说明当时的结果，不能说明已经记住。题库没有这道题的新编变式。</p><p class="small muted">原因：${esc(state.notes[m.id]||'未标注')}。没有选择时保持未标注，不会按分数或速度猜测。</p><details><summary>先想一想，再看解析</summary><p>答案：<strong>${math(q.answer)}</strong></p><div class="explanation"><strong>本题关键方法：${esc(q.methodName)}</strong><br>${math(q.explanation)}</div></details>${btn(state.settings.pins.includes(m.id)?'已标记下次换入':'下次周六换入这题','pin','',`data-id="${m.id}"`)}</article>`};return `<div class="section-head"><div><div class="eyebrow">A CLUE, NOT MORE HOMEWORK</div><h1>错题回顾</h1></div><span class="tag">记录不等于作业</span></div><div class="card tint"><h2>答错和未作答分开记</h2><p>这里可以回看，但没有“补完全部错题”的任务。下次周六最多换入1–2道，阶段回看最多1道，总数仍是5题、30分钟。要到另一个日期才会换入，避免刚做完立刻重做。</p><p class="small muted">巩固只表示：在更晚的两个不同日期分别答对。同一天重做不算。这不是“已经记住”。</p>${btn('回到本周训练','navHome','primary')}</div>${!ms.length?'<div class="card empty">暂时没有错题或未作答。交卷后会留在这里，旧记录里没有的过程会写未记录。</div>':''}${wrongs.length?`<h2>答错</h2>${wrongs.map(card).join('')}`:''}${blanks.length?`<h2>未作答</h2>${blanks.map(card).join('')}`:''}${doneMs.length?`<h2>已在两个更晚日期答对</h2>${doneMs.map(card).join('')}`:''}`}
function choiceText(row,unknown,i,blankWord){if(unknown&&unknown[i]||row==null)return '未记录';const v=row[i];if(v==null)return blankWord;return 'ABCDE'[v]}
function screenText(ms){if(ms==null)return '未记录';const s=Math.round(ms/1000);return `估计在屏 ${time(s)}。这不是实际思考时间，切走或关闭的时间没有算进去。`}
function eventLine(e){const name={answer:'选择',clear:'清空',flag:'标记稍后再做',unflag:'取消标记',skip:'未答就跳过',jump:'切到另一题',revisit:'返回看过的题',submit:'主动交卷',timeout:'到时交卷',summary:'较早的操作已合并'}[e.type]||e.type;if(e.type==='summary')return `${name}（${e.folded||0}次）`;const when=new Date(e.t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});const pick=e.type==='answer'?` ${e.a==null?'空':('ABCDE'[e.a]||'')}→${e.b==null?'空':('ABCDE'[e.b]||'')}`:'';return `${when} · 第${(e.i==null?0:e.i)+1}题 · ${name}${pick}`}
function processBlock(h){if(h.events==null&&h.legacy)return '<p class="small muted">点击过程未记录。这是迁入前的旧进度，只保留了最终选项。</p>';const events=h.events||[];return h.ids.map((id,i)=>{const mine=events.filter(e=>e.i===i&&e.type!=='summary');const summary=events.filter(e=>e.type==='summary');return `<div class="compact-source"><strong>第${i+1}题</strong><p class="small">最初选择：${choiceText(h.initial,h.initialUnknown,i,'这次没有选过')}　最后选择：${h.answers[i]==null?'未作答':'ABCDE'[h.answers[i]]}　${screenText(h.activeMs?h.activeMs[i]:h.activeMs)}</p>${summary.length&&i===0?`<p class="small muted">${esc(eventLine(summary[0]))}</p>`:''}${mine.length?`<ul class="timeline">${mine.map(e=>`<li>${esc(eventLine(e))}</li>`).join('')}</ul>`:'<p class="small muted">这一题没有单独的操作记录。</p>'}</div>`}).join('')}
function analysisHTML(){const r=C.analyze(state,DATA,Date.now());const acc=r.accuracy;const pri=r.priorities.length?`<ol class="priority-list">${r.priorities.map(p=>`<li><strong>${esc(p.methodName)}</strong>（${esc(p.topic)}）答错 ${p.wrong} 次，未作答 ${p.blank} 次，出现 ${p.attempts} 次。${esc(p.reason)}。对应记录：${p.attemptIds.map(esc).join('、')||'未记录'}。</li>`).join('')}</ol>`:'<p>下一次周六没有必须替换的错题。</p>';const weeks=r.weekRows.length?r.weekRows.map(w=>`<tr><td>第${w.week}周</td><td>${w.attempts}</td><td>${w.correct}/${w.total}</td><td>${w.blank}</td><td>${w.wrong}</td><td>${esc(w.latestId)}</td></tr>`).join(''):'<tr><td colspan="6">还没有交卷记录</td></tr>';const topics=r.topics.length?r.topics.map(t=>`<tr><td>${esc(t.topic)}</td><td>${t.correct}/${t.total}</td><td>${t.blank}</td><td>${t.wrong}</td><td>${t.limited?'样本只有'+t.sample+'题，不能当成稳定结论':'可以看这几次的计数'}</td></tr>`).join(''):'<tr><td colspan="5">还没有记录</td></tr>';let split='还没有足够记录。';if(r.attempts&&r.unrecordedSplit&&r.fresh==null)split='旧记录没有分开统计新题和回看，这一项是未记录。';else if(r.attempts&&r.fresh)split=`新题答对 ${r.fresh.correct}/${r.fresh.total}，未作答 ${r.fresh.blank}。回看题答对 ${r.review.correct}/${r.review.total}，未作答 ${r.review.blank}。${r.unrecordedSplit?'另有旧记录没有这项区分，那些显示未记录。':''}`;return `<section class="card"><h2>各周做题情况</h2><p>${esc(r.trend)}</p><p class="small">全部交卷 ${r.attempts} 次。按每一题计：答对 ${acc.correct}/${acc.total||0}，未作答 ${acc.blank}，答错 ${acc.wrong}。分母是这些记录里的题目次数，不是正式考试分数。</p><div class="table-wrap"><table><thead><tr><th>周</th><th>交卷次数</th><th>最近一次答对</th><th>最近一次未作答</th><th>最近一次答错</th><th>最近一次记录</th></tr></thead><tbody>${weeks}</tbody></table></div><h3>主题样本</h3><div class="table-wrap"><table><thead><tr><th>主题</th><th>答对/题次</th><th>未作答</th><th>答错</th><th>怎么看</th></tr></thead><tbody>${topics}</tbody></table></div><p class="split-note">${split}</p><h3>下次周六，先看这1–2件</h3>${pri}<p class="small muted">这里只根据已经留下的记录。样本少就不写成趋势。不估计正式考试分数，也不判断孩子属于哪种类型。</p></section>`}
function parentHTML(){const last=state.history.at(-1),s=state.settings;const kb=Math.max(1,Math.ceil(C.stateChars(state)/1024));return `<div class="section-head"><div><div class="eyebrow">LESS PRESSURE, CLEARER THINKING</div><h1>家长与资料</h1></div><span class="tag">每周总预算30分钟</span></div>${activeCard()}${analysisHTML()}<section class="card"><h2>只安排每周六一次</h2><p class="muted">周一至周五与周日没有训练任务。参考开始日默认2026-11-07周六，可以改成另一个周六；周次始终手动推进。缺席顺延、重练都可以，没有补课债务或自动提醒。</p><div class="settings-grid" style="grid-template-columns:1.5fr 1fr 1fr"><label class="field">参考开始日（周六）<input id="startDate" type="date" value="${esc(s.startDate)}"></label><label class="field">当前周<select id="weekSetting">${DATA.weeks.map(w=>`<option value="${w.week}" ${w.week===s.week?'selected':''}>第${w.week}周</option>`).join('')}</select></label><div style="align-self:end">${btn('保存参考安排','saveSettings','primary')}</div></div><p class="date-explanation">日期只是参考，不会因错过日期判定欠课。按家中实际情况顺延即可；也不会创建通知、日历或推送。</p></section><section class="card tint"><h2>下一步，只选一个动作</h2><p>${esc(C.suggestion(last,DATA.bank))}</p><p class="small muted">第1周观察起点已融入5题。不存在独立诊断、三路线打卡或额外模拟。不同周的题难度不等，5题结果不是官方分数。</p></section><section class="card"><h2>每一次交卷都留着</h2><p class="small muted">重做不会盖掉上一次。点开可以看最终选项、正确答案和当时记下的过程。没有记下的项目写未记录。</p>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>完成时间（上海）</th><th>周次</th><th>结果</th><th>过程</th><th></th></tr></thead><tbody>${state.history.slice().reverse().slice(0,60).map(h=>`<tr><td>${esc(new Date(h.finished).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</td><td>第${h.week}周</td><td>答对 ${h.score}/5<br><span class="small muted">未作答 ${C.score(h.ids,h.answers,DATA.bank).blank}</span></td><td>${h.events==null?'未记录':(h.events.length+'条')}</td><td>${btn('查看','history','',`data-id="${h.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">还没有本周30分钟版记录。旧版每日训练的完成记录不会自动转入。</p>'}<p class="small muted">本机进度约 ${kb} KB，只在这个浏览器里。最多保留1000次，页面列出最近60次。</p></section><section class="card b function reasonSelect(id){const current=state.notes[id];const list=CHOICE_REASONS.slice();if(current&&!list.includes(current))list.push(current);const cur=current||'未标注';return `<label class="small">原因 <select data-note="${esc(id)}" aria-label="原因">${list.map(n=>`<option ${cur===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`}
function resultHTML(){const h=state.history.find(x=>x.id===resultId);if(!h){go('home');return}const a=state.active,current=a?.historyId===h.id,sc=C.score(h.ids,h.answers,DATA.bank);app.innerHTML=`<div class="section-head session-header"><div><div class="eyebrow">ONE GOOD REFLECTION IS ENOUGH</div><h1>讲透一题，就很值得。</h1></div>${current?`<div><div class="timer-label">本次30分钟剩余 · 精选复盘</div><div class="timer" id="sessionTimer">${time(C.remaining(a.deadline,Date.now()))}</div></div>`:''}</div><div class="note backup"><strong>请家长导出一份 JSON。</strong>这次的选项和操作过程在这台浏览器里。换设备或清除网站数据会丢失。做题时不会自动上传。${btn('导出进度JSON','export','primary')}</div><section class="hero result-hero"><div><span class="tag">第${h.week}周 · ${esc(DATA.weeks[h.week-1].title)}</span><div class="result-score"><strong>${h.score}</strong><span>/ 5 题答对 · 未作答${sc.blank}题 · 答错${sc.wrong}题</span></div><p class="muted">作答用时 ${time(Math.round(h.duration))} · ${h.reason==='timeout'?'到时自动交卷':'主动交卷'}。少量代表题不代表正式考试结果。</p><div class="row">${btn(h.reviewDone?'回到本周':'复盘完成，保留本周','finish','primary',`data-id="${h.id}"`)}${!h.reviewDone&&h.week<12?btn('复盘完成，下次周六下一周','finishNext','',`data-id="${h.id}"`):''}</div></div><div><h3>剩余7分钟怎么用？</h3><p class="small">挑1–2道错题或最犹豫的题，说清关键方法。不要求现在看完所有解析。</p><p class="small muted">提前交卷可把未用时间用于复盘，仍不超过本次30分钟。周中没有额外任务。</p></div></section>${planNote({replacements:h.replacements,kept:h.ids.filter((id,i)=>h.roles&&(h.roles[i]==='planned'||h.roles[i]==='planned-review'||h.roles[i]==='mistake-merged'))},DATA.weeks[h.week-1])}<div class="card tint"><p>${esc(C.suggestion(h,DATA.bank))}</p><p class="small muted">以下解析是回顾材料，不是新增作业。下周最多替换1–2题，阶段回看最多1题，总量仍为5题。</p></div><details><summary>查看这次的作答过程</summary>${h.legacy?'<p class="small muted">题目文字按题号保留；点击过程和在屏时间未记录。</p>':''}${processBlock(h)}</details><div class="section-head"><h2>交卷后的逐题解释</h2><span class="small muted">精选1–2题即可</span></div>${h.ids.map((id,i)=>{const q=qview(id),ok=h.answers[i]===q.correct,blank=h.answers[i]===null;return `<article class="review-item ${ok?'good':'bad'}"><div class="row" style="justify-content:space-between"><div><span class="tag ${ok?'':'warm'}">${i+1} · ${ok?'答对':blank?'未作答':'答错'}</span> <span class="small muted">${esc(q.topic)}</span></div>${reasonSelect(id)}</div><h3 style="margin-top:13px">${math(q.prompt)}</h3>${diagram(q)}<p class="small">最初选择：${choiceText(h.initial,h.initialUnknown,i,'这次没有选过')}　最后选择：${blank?'未作答':`${'ABCDE'[h.answers[i]]} · ${math(q.options[h.answers[i]])}`}　答案：<strong>${'ABCDE'[q.correct]} · ${math(q.answer)}</strong></p><p class="small muted">${screenText(h.activeMs?h.activeMs[i]:null)}</p><div class="explanation"><strong>本题关键方法：${esc(q.methodName)}</strong><br>${math(q.method)}<br><br>${math(q.explanation)}</div></article>`}).join('')}<div class="row">${btn('完成本次复盘','finish','primary',`data-id="${h.id}"`)}${btn('返回本周','navHome')}</div>`}
function confirmSubmit(){const a=state.active;if(!a||a.phase!=='solve')return;modal('准备交卷？',`<p>已答${a.answers.filter(x=>x!==null).length}/5题，空白${a.answers.filter(x=>x===null).length}题，标记${a.flags.filter(Boolean).length}题。</p><p>交卷后才能看解析，这次选择不能再改。保留空白也可以。</p><p class="small muted">确认窗口不暂停计时；后续复盘已包含在30分钟内。</p>`,()=>submit('manual'),'确认交卷')}
function finish(id,next){const h=state.history.find(h=>h.id===id);if(!h)return;if(state.active&&state.active.historyId!==id){toast('先结束正在进行的这一份训练。');return}h.reviewDone=true;if(state.active?.historyId===id)state.active=null;state.settings.week=next?Math.min(12,h.week+1):h.week;save();go('home');toast(next?'已设为下一周，下次周六再开始；周中不用训练。':'本次已记录。下次周六可重练本周或手动选择下一周。')}
function tick(){const a=state.active;if(!a)return;const next=C.phase(a,Date.now());if(next==='submit'){$('#modalHost').innerHTML='';submit('timeout');return}if(next!==a.phase){flushView();a.phase=next;save();if(view==='session')sessionHTML()}const t=$('#sessionTimer');if(t&&t.textContent!==undefined){const end=a.phase==='learn'?a.learnEnd:a.phase==='solve'?a.solveDeadline:a.deadline;const r=C.remaining(end,Date.now());t.textContent=time(r);t.classList.toggle('warn',r<=60)}}
function download(text,name,mime='application/json'){const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function applyImport(clean){state=clean;mapWeek=state.settings.week;save();view=state.active?'session':'home';tick();render();toast('进度已导入。')}
function importProgress(file){if(!file)return;if(file.size>5*1024*1024){toast('请导入5MB以内的进度JSON。');return}const r=new FileReader();r.onerror=()=>toast('文件读取失败');r.onload=()=>{let clean;try{clean=C.cleanState(JSON.parse(r.result),DATA)}catch(e){toast('导入失败：'+e.message);return}modal('替换这台浏览器里的进度？',`<p>备份有${clean.history.length}次训练记录，将覆盖当前进度与正在计时的一份。建议先取消并导出当前JSON。</p>`,()=>applyImport(clean),'确认替换')};r.readAsText(file)}
async function importFromRepo(){if(typeof fetch!=='function'){toast('当前环境不能读取仓库。请改用导出的 JSON 文件。');return}let text;try{const res=await fetch(REPO_RAW,{cache:'no-store',credentials:'omit'});if(res.status===404){toast('仓库里还没有进度文件。这不是自动同步，需要家长先把导出的 JSON 上传为 amc8-progress/latest.json。');return}if(!res.ok)throw Error('HTTP '+res.status);text=await res.text()}catch(e){toast('没有读到仓库里的进度文件。本机记录未改。');return}if(text.length>5*1024*1024){toast('仓库里的进度文件超过5MB，已拒绝。本机记录未改。');return}let clean;try{clean=C.cleanState(JSON.parse(text),DATA)}catch(e){toast('仓库文件不是有效进度：'+e.message);return}modal('用仓库里的进度替换本机记录？',`<p>读到${clean.history.length}次训练。将覆盖这台浏览器里的每周进度。这不是自动同步，只是这一次读入。</p>`,()=>applyImport(clean),'确认替换')}
function moveTo(nextIndex,kind){const a=state.active;flushView();const from=a.index;if(kind==='skip')log('skip',{i:from,a:from,b:nextIndex});else if(a.visited&&a.visited[nextIndex])log('revisit',{i:nextIndex,a:from,b:nextIndex});else log('jump',{i:nextIndex,a:from,b:nextIndex});a.index=nextIndex;openView();save();sessionHTML()}
function handle(action,el){tick();const a=state.active;switch(action){
case 'start':start(Number(el.dataset.week||state.settings.week));break;
case 'resume':view='session';render();break;
case 'navHome':go('home');break;
case 'navMap':go('map');break;
case 'weekDetail':mapWeek=Number(el.dataset.week);view='map';render();$('#weekDetails')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'chooseWeek':state.settings.week=Number(el.dataset.week);mapWeek=state.settings.week;save();go('home');toast('只切换周次，不表示完成，也不需要补做错过的周。');break;
case 'answer':if(a?.phase==='solve'){flushView();const prev=a.answers[a.index],nextN=Number(el.dataset.answer);noteInitial(a.index,nextN);a.answers[a.index]=nextN;log('answer',{a:prev==null?null:prev,b:nextN});openView();save();sessionHTML();app.querySelector(`[data-action="answer"][data-answer="${el.dataset.answer}"]`)?.focus()}break;
case 'clearAnswer':if(a?.phase==='solve'){flushView();const prev=a.answers[a.index];a.answers[a.index]=null;log('clear',{a:prev==null?null:prev,b:null});openView();save();sessionHTML()}break;
case 'flag':if(a?.phase==='solve'){flushView();a.flags[a.index]=!a.flags[a.index];log(a.flags[a.index]?'flag':'unflag');openView();save();sessionHTML()}break;
case 'next':if(a?.phase==='solve')moveTo(Math.min(4,a.index+1),a.answers[a.index]==null?'skip':'move');break;
case 'prev':if(a?.phase==='solve')moveTo(Math.max(0,a.index-1),'move');break;
case 'jump':if(a?.phase==='solve')moveTo(Number(el.dataset.index),'move');break;
case 'submit':confirmSubmit();break;
case 'finish':finish(el.dataset.id,false);break;
case 'finishNext':finish(el.dataset.id,true);break;
case 'history':resultId=el.dataset.id;view='result';render();window.scrollTo(0,0);break;
case 'pin':{const id=el.dataset.id;if(!state.settings.pins)state.settings.pins=[];if(state.settings.pins.includes(id))state.settings.pins=state.settings.pins.filter(x=>x!==id);else if(state.settings.pins.length>=2){toast('下次周六最多换入2道，请先取消一道。');break}else state.settings.pins=state.settings.pins.concat(id);save();render();toast('只影响下次周六的5题，不加时间。同一天不会立刻重做。');break}
case 'saveSettings':{const startDate=$('#startDate').value,week=Number($('#weekSetting').value);try{const candidate=C.cleanState({...state,settings:{week,startDate,pins:state.settings.pins||[]}},DATA);state.settings=candidate.settings;mapWeek=week;save();render();toast('参考周六已保存，周次仍手动控制。')}catch(e){toast(e.message)}break}
case 'export':download(JSON.stringify(state,null,2),'AMC8每周30分钟-进度-'+C.dayKey(Date.now())+'.json');toast('已导出JSON。文件在下载文件夹，不会自动上传。');break;
case 'import':$('#importFile').click();break;
case 'repoImport':importFromRepo();break;
case 'rawExport':try{download(localStorage.getItem(KEY)||localStorage.getItem(V2)||'null','AMC8每周30分钟-原始存储.txt','text/plain')}catch(e){toast('浏览器拒绝读取存储。')}break;
case 'clear':modal('清除这台浏览器里的新版进度？','<p>将删除每周30分钟版的成绩、过程和当前计时。不能撤销，请先导出JSON。GitHub 上家长另外上传的文件不会被这台浏览器删掉。</p>',()=>{state=C.defaults();try{localStorage.removeItem(KEY);localStorage.setItem(KEY+'-test','1');localStorage.removeItem(KEY+'-test');canStore=true;storageError=''}catch(e){canStore=false}save();storageNotice();go('home');toast('已清除本机新版进度。')},'确认清除',true);break;
}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}const b=e.target.closest('[data-action]');if(b&&!b.disabled)handle(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.dataset.note){const v=e.target.value;if(!C.REASONS.includes(v))return;const id=e.target.dataset.note;if(v==='未标注')delete state.notes[id];else state.notes[id]=v;const h=state.history.find(x=>x.id===resultId);if(h){h.reasons=h.reasons||{};if(v==='未标注')delete h.reasons[id];else h.reasons[id]=v}save()}if(e.target.id==='importFile'){importProgress(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if($('#modalHost').children.length||view!=='session'||state.active?.phase!=='solve'||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if('abcde'.includes(k)&&k.length===1){e.preventDefault();handle('answer',{dataset:{answer:String('abcde'.indexOf(k))}})}else if(k==='arrowleft'){e.preventDefault();handle('prev',{})}else if(k==='arrowright'){e.preventDefault();handle('next',{})}else if(k==='f'){e.preventDefault();handle('flag',{})}});
document.addEventListener('visibilitychange',()=>{if(!pageActive())flushView();else openView();save();if(!document.hidden)tick()});
window.addEventListener('blur',()=>{flushView();save()});
window.addEventListener('focus',()=>{openView();save();tick()});
window.addEventListener('pageshow',tick);
window.addEventListener('beforeunload',()=>{flushView();save()});
if(state.active)view='session';tick();render();setInterval(tick,500);
})();
</script></body></html>
