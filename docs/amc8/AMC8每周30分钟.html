function render(){document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('on',n.dataset.nav===view));if(view==='session')return sessionHTML();if(view==='result')return resultHTML();app.innerHTML=({home:homeHTML,map:mapHTML,mistakes:mistakesHTML,parent:parentHTML}[view]||homeHTML)()}
function homeHTML(){const w=DATA.weeks[state.settings.week-1],finished=DATA.weeks.filter(w=>done(w.week)).length;return `${activeCard()}<section class="hero"><div><div class="eyebrow">ONE SATURDAY. ONE SMALL DISCOVERY.</div><div class="row" style="margin-bottom:15px"><span class="tag">第 ${w.week} / 12 周</span><span class="tag warm">${w.checkpoint?'本周混合回看':'本周5道代表题'}</span></div><h1>每周六，<br>留30分钟想一想。</h1><p class="muted">${esc(w.title)} · ${esc(w.subtitle)}。不是每天练，也没有额外诊断、加测或书架作业。</p>${btn(state.active?'继续本周的30分钟':'开始本周的30分钟','start','primary',`data-week="${w.week}"`)}<div class="mini-caption muted">参考安排：${dateFor(w.week)}（上海日历） · 缺席就顺延，不用补课。</div></div><div class="hero-art" aria-hidden="true"><div class="orbit"><strong>30<span style="position:static;font-size:15px;box-shadow:none;background:none;padding:0 2px">min</span></strong><span class="a">只在周六 · 轻轻开始</span><span class="b">少做一点，想透一点</span></div></div></section><div class="stats"><div class="stat"><strong>1 次<span> / 周</span></strong><span>周一至周五、周日无任务</span></div><div class="stat"><strong>5 题<span> / 次</span></strong><span>不同关键方法，不靠堆题</span></div><div class="stat"><strong>${finished}<span> / 12 周</span></strong><span>完成复盘才记录 · 可重练</span></div></div><div class="grid2"><section class="card"><h2>30分钟，一份就够</h2>${budget()}<ul class="step-list"><li><div class="step-no">3′</div><div><strong>看一个概念和小例子</strong><span>第1周的起点观察直接融入5题，不另开诊断。</span></div></li><li><div class="step-no">20′</div><div><strong>自己尝试5道代表题</strong><span>画图、列小表，不会可以跳过，交卷前不显示答案。</span></div></li><li><div class="step-no">7′</div><div><strong>只讲透1–2道精选错题</strong><span>其余留在记录里，不要求周中补做。</span></div></li></ul></section><section class="card tint"><h2>这周抓住什么？</h2><p>${esc(w.intro)}</p><div class="row">${[...new Set(w.ids.map(id=>DATA.bank[id].topic))].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="small muted" style="margin-top:16px">${w.reviewId?`末尾1题回看第${w.reviewFrom}周重点。若有适合的过往错题，会替换或合并进这5题，绝不追加。`:'这5题就是起点观察，不据此分档定级，不增加题量。'}</p>${btn('看看12周怎么轮转','navMap')}</section></div><div class="note"><strong>这是低负担重点训练与兴趣/基础维护。</strong>12周合计仅6小时，不代表所有AMC8考法已掌握，也不承诺高分。基础薄弱可下次周六重练本周，缺席后顺延；不产生补课债务。</div>`}
function mapHTML(){const z=DATA.weeks[mapWeek-1];return `<div class="section-head"><div><div class="eyebrow">IMPORTANT IDEAS, SPACED OUT</div><h1>12周重点地图</h1></div><span class="tag">每周六一次 · 不加测</span></div><p class="muted">运算、数论、建模、几何、计数概率、规律逻辑和数据轮换出现。只抓关键代表方法，不声称穷尽全部考法。</p><div class="note">第4、8、12周用混合回看<strong>替换</strong>本周主题题组，仍然3′+20′+7′=30分钟。参考日期不催进度；缺席可顺延，下一周需手动选择。</div><div class="week-grid">${DATA.weeks.map(w=>`<article class="week-card ${mapWeek===w.week?'active':''} ${w.checkpoint?'checkpoint':''}"><div class="row" style="justify-content:space-between"><span class="tag">W${String(w.week).padStart(2,'0')}</span><span class="small muted">${done(w.week)?'✓ 已复盘':w.checkpoint?'混合回看':'重点轮转'}</span></div><h3>${esc(w.title)}</h3><p>${esc(w.subtitle)}<br>5题 · 总30分钟<br><span class="small">参考${dateFor(w.week)}</span></p>${btn('查看本周重点','weekDetail','',`data-week="${w.week}"`)}</article>`).join('')}</div><section class="card" id="weekDetails" style="margin-top:24px"><div class="section-head"><h2>第${z.week}周 · ${esc(z.title)}</h2>${btn('设为当前周','chooseWeek','primary',`data-week="${z.week}"`)}</div><p>${esc(z.intro)}</p>${budget()}<div class="table-wrap"><table><thead><tr><th>题位</th><th>本题关键方法</th><th>主题</th><th>安排</th></tr></thead><tbody>${z.ids.map((id,i)=>{const q=DATA.bank[id];return `<tr><td>${i+1}</td><td>${esc(q.methodName)}</td><td>${esc(q.topic)}</td><td>${id===z.reviewId?`回看第${z.reviewFrom}周，可被适合的过往错题替换`:'代表题，先独立想'}</td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:13px">这不是额外作业清单。每周只有这一份5题，复盘只讲1–2题，不另设工作日练习。</p>${btn(`开始第${z.week}周的30分钟`,'start','',`data-week="${z.week}"`)}</section>`}
function mistakesHTML(){const ms=C.mistakes(state.history,DATA.bank);return `<div class="section-head"><div><div class="eyebrow">A CLUE, NOT MORE HOMEWORK</div><h1>错题回顾</h1></div><span class="tag">记录不等于作业</span></div><div class="card tint"><h2>错题不另加时间</h2><p>这里可以回看，但没有“补完全部错题”的任务。下次周六最多选1道适合的过往错题，替换或合并到原有5题；没有合适的就照原计划。</p><p class="small muted">在两个后续不同日期独立答对，才标记为已巩固。重练同一周也可以，不为清空错题而加练。</p>${btn('回到本周训练','navHome','primary')}</div>${!ms.length?'<div class="card empty">暂时没有错题记录。完成本周5题后，会自动留下值得回看的问题。</div>':ms.slice().reverse().map(m=>{const q=DATA.bank[m.id];return `<article class="review-item ${m.mastered?'good':'bad'}"><div class="row"><span class="tag ${m.mastered?'':'warm'}">${m.mastered?'已巩固':'留待合适的一周回看'}</span><span class="small muted">${esc(q.topic)} · ${esc(state.notes[m.id]||'未归因')}</span></div><h3 style="margin-top:12px">${math(q.prompt)}</h3>${diagram(q)}<details><summary>先想一想，再看解析</summary><p>答案：<strong>${math(q.answer)}</strong></p><div class="explanation"><strong>本题关键方法：${esc(q.methodName)}</strong><br>${math(q.explanation)}</div></details></article>`}).join('')}`}
function parentHTML(){const last=state.history.at(-1),s=state.settings;return `<div class="section-head"><div><div class="eyebrow">LESS PRESSURE, CLEARER THINKING</div><h1>家长与资料</h1></div><span class="tag">每周总预算30分钟</span></div>${activeCard()}<section class="card"><h2>只安排每周六一次</h2><p class="muted">周一至周五与周日没有训练任务。参考开始日默认2026-11-07周六，可以改成另一个周六；周次始终手动推进。缺席顺延、重练都可以，没有补课债务或自动提醒。</p><div class="settings-grid" style="grid-template-columns:1.5fr 1fr 1fr"><label class="field">参考开始日（周六）<input id="startDate" type="date" value="${esc(s.startDate)}"></label><label class="field">当前周<select id="weekSetting">${DATA.weeks.map(w=>`<option value="${w.week}" ${w.week===s.week?'selected':''}>第${w.week}周</option>`).join('')}</select></label><div style="align-self:end">${btn('保存参考安排','saveSettings','primary')}</div></div><p class="date-explanation">日期只是参考，不会因错过日期判定欠课。按家中实际情况顺延即可；也不会创建通知、日历或推送。</p></section><section class="card tint"><h2>下一步，只选一个动作</h2><p>${esc(C.suggestion(last,DATA.bank))}</p><p class="small muted">第1周观察起点已融入5题。不存在独立诊断、三路线打卡或额外模拟。不同周的题难度不等，5题结果不是官方分数预测。</p></section><section class="card"><h2>学习记录</h2>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>完成时间（上海）</th><th>周次</th><th>作答结果</th><th>作答用时</th><th>复盘</th><th></th></tr></thead><tbody>${state.history.slice().reverse().slice(0,60).map(h=>`<tr><td>${esc(new Date(h.finished).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</td><td>第${h.week}周<br><span class="muted small">${esc(DATA.weeks[h.week-1].title)}</span></td><td>${h.score}/5<br><span class="small muted">${state.history.filter(x=>x.week===h.week).length>1?'含重练，不当新测':'原创代表题'}</span></td><td>${time(Math.round(h.duration))}</td><td>${h.reviewDone?'已复盘':'待复盘'}</td><td>${btn('查看','history','',`data-id="${h.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">还没有本周30分钟版记录。旧版每日训练的完成记录不会自动转入。</p>'}<p class="small muted">最多保留1000次，页面显示最近60次。只在完成复盘后记录该周完成，重复不影响是否可选下一周。</p></section><section class="card"><h2>本机进度与备份</h2><p>只保存在同一设备、同一浏览器。Safari和Chrome、离线文件与线上GitHub Pages的进度不互通，可通过JSON导出/导入迁移。移动文件或清理浏览器数据可能看不到原记录。</p><p class="small muted">Safari本地文件模式可能拒绝存储，网站会提示并继续在内存工作，关页前需导出。新版与旧版使用不同存储键，不会静默把旧日练判成本周完成。</p><div class="row">${btn('导出新版进度JSON','export','primary')}${btn('导入新版进度JSON','import')}${storageError?btn('导出原始存储备份','rawExport'):''}${btn('清除新版本机数据','clear','danger')}</div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><p class="small muted" style="margin-top:12px">只解析严格验证的JSON，不执行内容；导入覆盖、清除均需确认。不采集姓名或邮箱，无追踪或自动上传。学习记录不要提交到公开仓库。</p></section><section class="card"><h2>资料只留两个可选入口</h2><p>不是额外作业，也不要求买书。首选直接使用本周网页。若确需外部材料，只能替换原有时段/题位，不能叠加到30分钟之外。</p><div class="grid2"><div class="card tint"><h3>${link('AoPS Prealgebra','https://artofproblemsolving.com/store/book/prealgebra')}</h3><span class="tag gray">英文 · 收费书 · 未核验售价</span><p style="margin-top:12px">基础概念不稳时，由家长选一个小例子，替换本周开头3分钟概念环节。无需通读、无需另做书后题。</p></div><div class="card tint"><h3>${link('LIVE 授权AMC真题档案','https://live.poshenloh.com/past-contests')}</h3><span class="tag gray">英文 · 免费真题入口</span><p style="margin-top:12px">家长若想接触真题，可挑一道适合的旧题，替换本周一道同主题代表题，用草稿纸作答。此低负担安排不要求另做40分钟整卷。</p></div></div><details><summary>家长参考：原研究的其它来源与核验限制</summary><p class="small muted">以下是资料索引，不是训练清单，不给孩子增加工作日任务。部分资源收费或需账号；本次未购买、登录或提交表单。</p>${SOURCES.map(x=>`<div class="compact-source"><h3>${link(x.title,x.url)}</h3><p class="small">${esc(x.cost)} · ${esc(x.language)} · ${esc(x.practice)}</p><p class="small muted">2026-11-07（Asia/Shanghai）核验：${esc(x.status)}</p></div>`).join('')}</details></section><section class="card warm"><h2>边界说清楚，心里更轻松</h2><p>这是原创AMC8风格的低负担重点训练，12次总计6小时，适合兴趣和基础维护，不能承诺全面掌握所有考法或取得高分。图形、复杂图表和空间想象等未系统覆盖；若目标是正式考试成绩，需要另行评估现实投入，而不是在这里偷偷加作业。</p><p>MAA官方核验：正式AMC8为25题40分钟，主页资格为8年级及以下、考试日未满15.5岁。2027主办方窗口为1月21–27日，国际考点场次和资格须另确认。原卷计分为答对1分、错/空白0分，2027以当年说明为准。</p><p class="small muted">本计划12个周六从2026-11-07排到2027-01-23，只作参考，不是承诺考前完整备考的倒计时。本次新版真实GUI尚未测试；旧版Chrome测试结论不能替代新版Safari/Chrome验证。</p></section>`}
function diagram(q){return q.svg?`${q.svg}<div class="diagram-note">示意图不按比例，请以题目数值为准。</div>`:''}
function start(week){if(state.active){view='session';render();return}if(state.history.length>=1000){toast('记录已满1000次，请先导出备份，再清理新版数据。');return}const w=DATA.weeks[week-1];if(!w)return;modal(`第${week}周 · 本次总30分钟`,`<p>3分钟概念/小例子 → 20分钟独立做5题 → 7分钟精选复盘。${week===1?'起点观察融入这5题，没有额外诊断。':''}</p><p>准备草稿纸，不用计算器或搜索。错题如需回看只替换/合并，不追加题目。${done(week)?'本周已做过，这次属于重练，分数不作新测。':''}</p><div class="note">开始后不暂停，关页/休眠也继续计时。过期恢复会自动交卷。缺席就下次顺延，不必今天补做其它周。</div>`,()=>{const now=Date.now(),picked=C.sessionQuestions(w,state.history,DATA.bank,now);state.active={week,ids:picked.ids,answers:Array(5).fill(null),flags:Array(5).fill(false),started:now,learnEnd:now+180000,solveDeadline:now+1380000,deadline:now+1800000,phase:'learn',index:0,historyId:null,reviewIds:picked.reviewIds,replaced:picked.replaced};state.settings.week=week;save();view='session';resultId=null;render();window.scrollTo(0,0)},'准备好了，开始本周30分钟')}
function sessionHTML(){const a=state.active;if(!a){go('home');return}if(a.phase==='review'){view='result';resultId=a.historyId;resultHTML();return}const w=DATA.weeks[a.week-1];if(a.phase==='learn'){app.innerHTML=`<div class="section-head session-header"><div><div class="eyebrow">FIRST, ONE CLEAR IDEA</div><h2>第${a.week}周 · ${esc(w.title)}</h2><p class="small muted">本周仅此一次：3′概念 + 20′作答 + 7′复盘</p></div><div><div class="timer-label">概念环节剩余</div><div class="timer" id="sessionTimer">${time(C.remaining(a.learnEnd,Date.now()))}</div></div></div><section class="lesson-box"><span class="tag warm">01 · 概念与小例子 · 3分钟</span><h2 style="margin-top:18px">先想明白一个方法</h2><p class="lesson-text">${esc(w.intro)}</p><div class="explanation" style="font-size:17px"><strong>一个小例子 / 思路回看</strong><br>${math(w.example)}</div><p class="muted" style="margin-top:20px">读完后准备草稿纸。计时到3分钟会自动进入5题作答，不用开启另一个任务。</p>${budget()}<div class="note">本环节不是题目答案。接下来20分钟先独立尝试，最后7分钟只讲透1–2题；没有工作日作业。</div></section>`;return}
const q=DATA.bank[a.ids[a.index]],ans=a.answers[a.index];app.innerHTML=`<div class="section-head session-header"><div><div class="eyebrow">FIVE IDEAS, YOUR OWN TRY</div><h2>第${a.week}周 · ${esc(w.title)}</h2><p class="small muted">原创AMC8风格 · 本次总5题 · 答对1分，错/空白0分</p></div></div><div class="question-layout"><section class="card question-card"><div class="row" style="justify-content:space-between"><div><span class="tag">第 ${a.index+1} / 5 题</span> <span class="tag gray">${esc(q.topic)}</span> ${a.reviewIds.includes(q.id)?'<span class="tag warm">过往重点回看 · 已计入5题</span>':''}</div>${btn(a.flags[a.index]?'★ 已标记':'☆ 稍后再做','flag',a.flags[a.index]?'flag-on':'')}</div><div class="qprompt" id="prompt">${math(q.prompt)}</div>${diagram(q)}<div class="options" role="group" aria-labelledby="prompt">${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''}" data-action="answer" data-answer="${i}" aria-pressed="${ans===i}"><span class="letter">${'ABCDE'[i]}</span><span>${math(o)}</span></button>`).join('')}</div><div class="qfoot">${btn('← 上一题','prev','',a.index===0?'disabled':'')}${btn('清空选择','clearAnswer')}${btn(a.index===4?'检查答题卡 →':'下一题 / 跳过 →',a.index===4?'submit':'next')}</div><div class="controls-note">快捷键：A–E选项，←/→切题，F标记。复盘已包含在本次30分钟，不需再做一份。</div></section><aside><section class="card"><div class="timer-label">独立作答剩余 · 不暂停</div><div class="timer" id="sessionTimer">${time(C.remaining(a.solveDeadline,Date.now()))}</div><p class="small muted">${a.answers.filter(v=>v!==null).length}/5 已作答</p><div class="question-nav" aria-label="题号导航">${a.ids.map((id,i)=>`<button class="${a.answers[i]!==null?'answered ':''}${a.index===i?'current ':''}${a.flags[i]?'flagged':''}" data-action="jump" data-index="${i}" aria-label="第${i+1}题${a.answers[i]!==null?'已答':'未答'}${a.flags[i]?'已标记':''}">${i+1}</button>`).join('')}</div><div class="small muted" style="margin:12px 0">绿色已答 · 橙点标记</div>${btn('检查并交卷','submit','primary')}</section><section class="card side-help"><h3>卡住就先跳过</h3><p class="small muted">画图、列小表，或先试一个小情况。不会也可以留空，不在工作日补题。</p><p class="small muted">20分钟作答结束自动交卷，余下7分钟精选复盘。</p></section></aside></div>`}
function submit(reason){const a=state.active;if(!a||a.phase==='review')return;const now=Date.now(),sc=C.score(a.ids,a.answers,DATA.bank),id=`h${now}_${state.history.length}`;state.history.push({id,week:a.week,ids:a.ids.slice(),answers:a.answers.slice(),flags:a.flags.slice(),started:a.started,finished:Math.max(a.started,Math.min(now,a.solveDeadline)),duration:Math.max(0,Math.min(1200,(Math.min(now,a.solveDeadline)-a.learnEnd)/1000)),score:sc.correct,total:5,reviewDone:false,reason});a.phase='review';a.historyId=id;save();view='result';resultId=id;render();window.scrollTo(0,0);if(reason==='timeout')toast('作答时间到，已自动交卷。精选复盘仍在本次30分钟内。')}
function resultHTML(){const h=state.history.find(h=>h.id===resultId);if(!h){go('home');return}const a=state.active,current=a?.historyId===h.id,sc=C.score(h.ids,h.answers,DATA.bank);app.innerHTML=`<div class="section-head session-header"><div><div class="eyebrow">ONE GOOD REFLECTION IS ENOUGH</div><h1>讲透一题，就很值得。</h1></div>${current?`<div><div class="timer-label">本次30分钟剩余 · 精选复盘</div><div class="timer" id="sessionTimer">${time(C.remaining(a.deadline,Date.now()))}</div></div>`:''}</div><section class="hero result-hero"><div><span class="tag">第${h.week}周 · ${esc(DATA.weeks[h.week-1].title)}</span><div class="result-score"><strong>${h.score}</strong><span>/ 5 题答对 · 空白${sc.blank}题</span></div><p class="muted">作答用时 ${time(Math.round(h.duration))} · ${h.reason==='timeout'?'到时自动交卷':'主动交卷'}。少量代表题不预测官方成绩。</p><div class="row">${btn(h.reviewDone?'回到本周':'复盘完成，保留本周','finish','primary',`data-id="${h.id}"`)}${!h.reviewDone&&h.week<12?btn('复盘完成，下次周六下一周','finishNext','',`data-id="${h.id}"`):''}</div></div><div><h3>剩余7分钟怎么用？</h3><p class="small">挑1–2道错题或最犹豫的题，说清“关键方法”和“下次怎么做”。不要求现在看完所有解析。</p><p class="small muted">提前交卷可把未用时间用于复盘，仍不超过本次30分钟；超时恢复时不再补足计时。周中没有额外任务。</p></div></section><div class="card tint"><p>${esc(C.suggestion(h,DATA.bank))}</p><p class="small muted">以下解析是回顾材料，不是新增作业。下周最多1题替换/合并回看，总量仍为5题。</p></div><div class="section-head"><h2>交卷后的逐题解释</h2><span class="small muted">精选1–2题即可</span></div>${h.ids.map((id,i)=>{const q=DATA.bank[id],ok=h.answers[i]===q.correct,blank=h.answers[i]===null;return `<article class="review-item ${ok?'good':'bad'}"><div class="row" style="justify-content:space-between"><div><span class="tag ${ok?'':'warm'}">${i+1} · ${ok?'答对':'可以再想'}</span> <span class="small muted">${esc(q.topic)}</span></div>${!ok?`<label class="small">错因 <select data-note="${id}" aria-label="第${i+1}题错因">${['未归因','读题','概念','计算','策略','时间'].map(n=>`<option ${state.notes[id]===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}</div><h3 style="margin-top:13px">${math(q.prompt)}</h3>${diagram(q)}<p class="small">你的选择：${blank?'未作答':`${'ABCDE'[h.answers[i]]} · ${math(q.options[h.answers[i]])}`}　｜　答案：<strong>${'ABCDE'[q.correct]} · ${math(q.answer)}</strong></p><div class="explanation"><strong>本题关键方法：${esc(q.methodName)}</strong><br>${math(q.method)}<br><br>${math(q.explanation)}</div></article>`}).join('')}<div class="row">${btn('完成本次复盘','finish','primary',`data-id="${h.id}"`)}${btn('返回本周','navHome')}</div>`}
function confirmSubmit(){const a=state.active;if(!a||a.phase!=='solve')return;modal('准备交卷？',`<p>已答${a.answers.filter(x=>x!==null).length}/5题，空白${a.answers.filter(x=>x===null).length}题，标记${a.flags.filter(Boolean).length}题。</p><p>交卷后才能看解析，这次选择不能再改。保留空白也可以，如实记录不会的题。</p><p class="small muted">确认窗口不暂停计时；后续复盘已包含在30分钟内。</p>`,()=>submit('manual'),'确认交卷')}
function finish(id,next){const h=state.history.find(h=>h.id===id);if(!h)return;if(state.active&&state.active.historyId!==id){toast('先结束正在进行的这一份训练。');return}h.reviewDone=true;if(state.active?.historyId===id)state.active=null;state.settings.week=next?Math.min(12,h.week+1):h.week;save();go('home');toast(next?'已设为下一周，下次周六再开始；周中不用训练。':'本次已记录。下次周六可重练本周或手动选择下一周。')}
function tick(){const a=state.active;if(!a)return;const next=C.phase(a,Date.now());if(next==='submit'){$('#modalHost').innerHTML='';submit('timeout');return}if(next!==a.phase){a.phase=next;save();if(view==='session')sessionHTML()}const t=$('#sessionTimer');if(t){const end=a.phase==='learn'?a.learnEnd:a.phase==='solve'?a.solveDeadline:a.deadline;const r=C.remaining(end,Date.now());t.textContent=time(r);t.classList.toggle('warn',r<=60)}}
function download(text,name,mime='application/json'){const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importProgress(file){if(!file)return;if(file.size>5*1024*1024){toast('请导入5MB以内的新版进度JSON。');return}const r=new FileReader();r.onerror=()=>toast('文件读取失败');r.onload=()=>{let clean;try{clean=C.cleanState(JSON.parse(r.result),DATA)}catch(e){toast('导入失败：'+e.message);return}modal('替换新版进度？',`<p>备份有${clean.history.length}次每周训练记录，将覆盖当前新版进度与正在计时的一份。建议先取消并导出当前JSON。</p><p>旧版进度不受影响。未结束的计时按原截止时刻恢复，可能立即自动交卷。</p>`,()=>{state=clean;mapWeek=state.settings.week;save();view=state.active?'session':'home';tick();render();toast('新版进度导入成功。')},'确认替换')};r.readAsText(file)}
function handle(action,el){tick();const a=state.active;switch(action){
case 'start':start(Number(el.dataset.week||state.settings.week));break;
case 'resume':view='session';render();break;
case 'navHome':go('home');break;
case 'navMap':go('map');break;
case 'weekDetail':mapWeek=Number(el.dataset.week);view='map';render();$('#weekDetails')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'chooseWeek':state.settings.week=Number(el.dataset.week);mapWeek=state.settings.week;save();go('home');toast('只切换周次，不表示完成，也不需要补做错过的周。');break;
case 'answer':if(a?.phase==='solve'){a.answers[a.index]=Number(el.dataset.answer);save();sessionHTML();app.querySelector(`[data-action="answer"][data-answer="${el.dataset.answer}"]`)?.focus()}break;
case 'clearAnswer':if(a?.phase==='solve'){a.answers[a.index]=null;save();sessionHTML()}break;
case 'flag':if(a?.phase==='solve'){a.flags[a.index]=!a.flags[a.index];save();sessionHTML()}break;
case 'next':if(a?.phase==='solve'){a.index=Math.min(4,a.index+1);save();sessionHTML()}break;
case 'prev':if(a?.phase==='solve'){a.index=Math.max(0,a.index-1);save();sessionHTML()}break;
case 'jump':if(a?.phase==='solve'){a.index=Number(el.dataset.index);save();sessionHTML()}break;
case 'submit':confirmSubmit();break;
case 'finish':finish(el.dataset.id,false);break;
case 'finishNext':finish(el.dataset.id,true);break;
case 'history':resultId=el.dataset.id;view='result';render();window.scrollTo(0,0);break;
case 'saveSettings':{const startDate=$('#startDate').value,week=Number($('#weekSetting').value);try{const candidate=C.cleanState({...state,settings:{week,startDate}},DATA);state.settings=candidate.settings;mapWeek=week;save();render();toast('参考周六已保存，周次仍手动控制。')}catch(e){toast(e.message)}break}
case 'export':download(JSON.stringify(state,null,2),'AMC8每周30分钟-进度-'+C.dayKey(Date.now())+'.json');toast('已导出新版JSON，请查看下载文件夹。');break;
case 'import':$('#importFile').click();break;
case 'rawExport':try{download(localStorage.getItem(KEY)||'null','AMC8每周30分钟-原始存储.txt','text/plain')}catch(e){toast('浏览器拒绝读取存储。')}break;
case 'clear':modal('清除新版本机进度？','<p>将删除每周30分钟版的成绩、错题和当前计时。不能撤销，请先导出JSON备份。旧版存储与已下载文件不受影响。</p>',()=>{state=C.defaults();try{localStorage.removeItem(KEY);localStorage.setItem(KEY+'-test','1');localStorage.removeItem(KEY+'-test');canStore=true;storageError=''}catch(e){canStore=false}save();storageNotice();go('home');toast('已清除本机新版进度。')},'确认清除',true);break;
}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}const a=e.target.closest('[data-action]');if(a&&!a.disabled)handle(a.dataset.action,a)});
document.addEventListener('change',e=>{if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save()}if(e.target.id==='importFile'){importProgress(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if($('#modalHost').children.length||view!=='session'||state.active?.phase!=='solve'||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if('abcde'.includes(k)&&k.length===1){e.preventDefault();handle('answer',{dataset:{answer:String('abcde'.indexOf(k))}})}else if(k==='arrowleft'){e.preventDefault();handle('prev',{})}else if(k==='arrowright'){e.preventDefault();handle('next',{})}else if(k==='f'){e.preventDefault();handle('flag',{})}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',save);if(state.active)view='session';tick();render();setInterval(tick,500);
})();
</script></body></html>
